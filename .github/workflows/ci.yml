name: Customer ETL CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint code
        run: |
          ruff check .

      - name: Run tests
        run: |
          python -m pytest


  build:

    needs: test

    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create ETL package
        run: |
          tar -czf customer-etl.tar.gz src tests requirements.txt

      - name: Upload ETL artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-etl-package
          path: customer-etl.tar.gz
          retention-days: 5
    
  deploy-staging:

    needs: build

    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: staging

    steps:

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: customer-etl-package

      - name: Deploy to staging
        run: |
          echo "================================="
          echo "Deploying Customer ETL"
          echo "Environment: STAGING"
          echo "================================="

          echo "Artifact:"
          ls -lh customer-etl.tar.gz

          echo "Deployment successful!"


  deploy-production:

    needs: deploy-staging

    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: customer-etl-package

      - name: Deploy to production
        run: |
          echo "================================="
          echo "Deploying Customer ETL"
          echo "Environment: PRODUCTION"
          echo "================================="

          echo "Artifact:"
          ls -lh customer-etl.tar.gz

          echo "Production deployment successful!"